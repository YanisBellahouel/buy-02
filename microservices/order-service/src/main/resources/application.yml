server:
  port: 8085

spring:
  application:
    name: order-service
  data:
    mongodb:
      uri: mongodb://admin:admin123@localhost:27017/orderdb?authSource=admin

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

services:
  cart-service:
    name: cart-service
  user-service:
    name: user-service
  product-service:
    name: product-service

jwt:
  secret: mySecretKeyForJWTTokenGenerationMustBeLongEnoughForHS512AlgorithmToWorkProperly
  expiration: 86400000